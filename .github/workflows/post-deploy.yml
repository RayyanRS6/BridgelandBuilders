# After every successful Vercel production deployment (SEO plan §3.6, §1,
# §3.8, §4):
#   1. IndexNow: tell Bing and the other IndexNow engines which URLs changed
#      (sitemap entries and redirect sources): this deployment's commit vs the
#      commit of the previous successful production deployment, read from the
#      GitHub Deployments API (Vercel reports its deployments there), so a
#      push of several commits, or a commit that never deployed, still pings
#      every URL that changed on the live site. No such deployment found (or
#      its commit can't be fetched): the previous commit (HEAD~1), as before.
#   2. Live redirect check: every legacy URL answers one 308/307 to the right
#      page, and that page answers 200. It runs against the production apex,
#      not the deployment URL: per-deployment *.vercel.app URLs sit behind
#      Vercel SSO and answer every request with 302 /sso-api.
#   3. Back-button check (scripts/check-history.mjs): no script adds history
#      entries on key pages. Playwright is installed for this job only; it is
#      not a project dependency.
#   4. Lighthouse CI (lighthouserc.json, separate job): mobile lab metrics on
#      5 URLs against the plan §4 budgets. Warnings only, and the job can
#      never fail the workflow; the reports are kept as a run artifact.
# Vercel's GitHub integration reports deployments to GitHub, which triggers
# deployment_status. No secrets are needed: the IndexNow key is the public
# key file in public/, and the scripts use only Node built-ins (plus
# Playwright / @lhci/cli, fetched by the jobs that use them). The workflow
# token only reads: contents (checkout, git fetch) and deployments (the
# previous production deployment's commit).
name: Post-deploy checks

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

# A new run waits for the running one instead of cancelling it (a cancelled
# run loses the IndexNow ping for its deploy's changed URLs). GitHub keeps at
# most one waiting run per group, so a third deploy still replaces a waiting one.
concurrency:
  group: post-deploy-${{ github.event.deployment.environment }}
  cancel-in-progress: false

env:
  SITE_URL: https://bridgelandbuilders.com

jobs:
  post-deploy:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The newest older deployment to this environment that ever reported
      # "success" (a deployment that was live turns "inactive" once a newer one
      # replaces it, so any success status counts). Its commit is fetched
      # (depth 1 is enough for git show) and passed to IndexNow as the base.
      # Never fails the job: on any problem the output stays empty and the
      # ping falls back to HEAD~1.
      - name: Find the previous production deployment
        id: base
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          CURRENT_ID: ${{ github.event.deployment.id }}
        run: |
          set +e
          base=""
          rows=$(gh api -X GET "repos/${REPO}/deployments" -f environment="${DEPLOY_ENV}" -F per_page=30 \
            --jq 'sort_by(.id) | reverse | .[] | "\(.id) \(.sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            [ "$id" -lt "$CURRENT_ID" ] 2>/dev/null || continue
            ok=$(gh api -X GET "repos/${REPO}/deployments/${id}/statuses" -F per_page=100 \
              --jq 'any(.[]; .state == "success")' < /dev/null)
            if [ "$ok" = "true" ]; then
              base="$sha"
              break
            fi
          done <<< "$rows"
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] \
            && git fetch --no-tags --depth=1 origin "$base" \
            && git cat-file -e "${base}^{commit}"; then
            echo "Previous successful production deployment: $base"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "No previous successful production deployment found (or its commit could not be fetched): using HEAD~1"
          fi
          exit 0

      - name: IndexNow ping
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/indexnow.mjs --head=HEAD --base="${BASE_SHA:-HEAD~1}"

      - name: Live redirect check
        if: ${{ always() }}
        run: npm run check:redirects -- "$SITE_URL" --mode=production

      - name: Install Playwright (this job only)
        if: ${{ always() }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Back-button check
        if: ${{ always() }}
        run: node scripts/check-history.mjs "$SITE_URL"

  lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lab numbers are a monitoring signal, never a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lighthouse CI (mobile, 3 runs per URL, warnings only)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep the Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-${{ github.event.deployment.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
